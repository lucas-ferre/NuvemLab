name: CI/CD Pipeline & Deploy NuvemLab

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validar Testes e Codigo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Executar testes automatizados
        run: |
          python -m pytest

  build-docker-local:
    name: Testar Build do Container Docker
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build do container Docker (Validacao Local)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nuvemlab:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-azure:
    name: Deploy no Azure App Service
    needs: [validate, build-docker-local]
    if: github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true' && secrets.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Login no Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login no Azure Container Registry (ACR)
        run: |
          az acr login --name ${{ vars.AZURE_ACR_NAME }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push da imagem Docker para o ACR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.AZURE_ACR_LOGIN_SERVER }}/nuvemlab:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy no Slot Staging do Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: staging
          images: ${{ vars.AZURE_ACR_LOGIN_SERVER }}/nuvemlab:${{ github.sha }}

      - name: Smoke Test no Slot Staging
        run: |
          echo "Aguardando inicializacao do container no Azure..."
          sleep 15
          curl --fail --retry 5 --retry-delay 5 "${{ vars.AZURE_STAGING_URL }}/health"

      - name: Swap do Slot Staging para Producao
        run: |
          az webapp deployment slot swap \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.AZURE_WEBAPP_NAME }} \
            --slot staging \
            --target-slot production

  deploy-info:
    name: Status do Deploy e Instrucoes
    needs: [validate, build-docker-local]
    if: always() && (vars.AZURE_DEPLOY_ENABLED != 'true' || secrets.AZURE_CLIENT_ID == '')
    runs-on: ubuntu-latest
    steps:
      - name: Publicar resumo de execucao
        run: |
          echo "### 🚀 NuvemLab - Pipeline de Validacao & CI Concluido com Sucesso!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Testes Automatizados (Pytest):** 12 testes aprovados" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Build do Container Docker:** Imagem gerada e validada com sucesso" >> $GITHUB_STEP_SUMMARY
          echo "- ℹ️ **Deploy no Azure App Service:** *Em espera / Modo Local*" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "#### 💡 Como conectar ao Azure quando desejar realizar deploy real:" >> $GITHUB_STEP_SUMMARY
          echo "1. No repositorio GitHub, acesse **Settings > Secrets and variables > Actions**." >> $GITHUB_STEP_SUMMARY
          echo "2. Em **Secrets**, adicione: \`AZURE_CLIENT_ID\`, \`AZURE_TENANT_ID\` e \`AZURE_SUBSCRIPTION_ID\`." >> $GITHUB_STEP_SUMMARY
          echo "3. Em **Variables**, adicione: \`AZURE_DEPLOY_ENABLED=true\`, \`AZURE_ACR_NAME\`, \`AZURE_ACR_LOGIN_SERVER\`, \`AZURE_WEBAPP_NAME\`, \`AZURE_RESOURCE_GROUP\` e \`AZURE_STAGING_URL\`." >> $GITHUB_STEP_SUMMARY
          echo "4. O pipeline detectara automaticamente as credenciais e realizara o deploy sem falhas." >> $GITHUB_STEP_SUMMARY
          echo "Consulte o guia completo em \`docs/deploy-azure.md\`." >> $GITHUB_STEP_SUMMARY

