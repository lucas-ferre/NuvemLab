name: Testar e implantar no Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nuvemlab-production
  cancel-in-progress: false

env:
  IMAGE_NAME: nuvemlab
  REGISTRY: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
  WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verificar qualidade
        run: |
          python -m ruff check app tests
          python -m pytest

  build-and-deploy:
    if: ${{ vars.AZURE_DEPLOY_ENABLED == 'true' }}
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Validar configuração do deploy
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          AZURE_ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_STAGING_URL: ${{ vars.AZURE_STAGING_URL }}
        run: |
          required=(
            AZURE_CLIENT_ID
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
            AZURE_ACR_NAME
            AZURE_ACR_LOGIN_SERVER
            AZURE_WEBAPP_NAME
            AZURE_RESOURCE_GROUP
            AZURE_STAGING_URL
          )
          missing=()

          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::error title=Configuração Azure incompleta::Defina: ${missing[*]}"
            echo "Consulte docs/deploy-azure.md para configurar o OIDC e o repositório."
            exit 1
          fi

      - name: Autenticar no Azure por OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Autenticar no Azure Container Registry
        run: az acr login --name "${{ vars.AZURE_ACR_NAME }}"

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir e publicar a imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Implantar no slot de staging
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          slot-name: staging
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Executar smoke test
        run: |
          base_url="${{ vars.AZURE_STAGING_URL }}"
          for path in health static/styles.css static/app.js; do
            curl --fail --silent --show-error \
              --retry 6 --retry-delay 10 \
              "${base_url}/${path}" > /dev/null
          done

      - name: Promover staging para produção
        run: >
          az webapp deployment slot swap
          --resource-group "${RESOURCE_GROUP}"
          --name "${WEBAPP_NAME}"
          --slot staging
          --target-slot production
