<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura simplificada do NuvemLab</title>
  <desc id="desc">Fluxo de entrega contínua do GitHub para o Azure Container Registry e Azure App Service, e fluxo de execução do usuário por HTTPS até o container FastAPI e o volume persistente.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbfe"/>
      <stop offset="1" stop-color="#eaf4fb"/>
    </linearGradient>
    <linearGradient id="azureFill" x1="0" x2="1">
      <stop offset="0" stop-color="#e8f5fd"/>
      <stop offset="1" stop-color="#f5fbff"/>
    </linearGradient>
    <linearGradient id="appFill" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0078d4"/>
      <stop offset="1" stop-color="#005a9e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#102238" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1l10 5-10 5Z" fill="#46647c"/>
    </marker>
    <marker id="arrowAzure" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1l10 5-10 5Z" fill="#0078d4"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #102238; }
      .title { font-size: 38px; font-weight: 700; letter-spacing: -1px; }
      .subtitle { font-size: 17px; fill: #4d6073; }
      .zone-label { font-size: 16px; font-weight: 700; fill: #0078d4; letter-spacing: 1.6px; }
      .node-title { font-size: 19px; font-weight: 700; }
      .node-copy { font-size: 14px; fill: #5c7183; }
      .small { font-size: 13px; fill: #536a7d; }
      .micro { font-size: 12px; fill: #5c7183; }
      .white { fill: #fff; }
      .white-soft { fill: #dff2ff; }
      .label { font-size: 12px; font-weight: 700; fill: #31536b; letter-spacing: .4px; }
      .line { fill: none; stroke: #46647c; stroke-width: 2.5; marker-end: url(#arrow); }
      .line-blue { fill: none; stroke: #0078d4; stroke-width: 2.5; marker-end: url(#arrowAzure); }
      .line-dashed { stroke-dasharray: 9 7; }
      .line-dotted { stroke-dasharray: 3 7; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1460" cy="90" r="210" fill="#39d4d8" opacity=".07"/>
  <circle cx="120" cy="820" r="250" fill="#0078d4" opacity=".05"/>

  <text x="72" y="66" class="title">NuvemLab - arquitetura simplificada</text>
  <text x="72" y="96" class="subtitle">Entrega automatizada e execução de um único container no Azure App Service (PaaS)</text>

  <rect x="562" y="132" width="966" height="680" rx="30" fill="url(#azureFill)" stroke="#8dcaf0" stroke-width="2"/>
  <rect x="590" y="154" width="170" height="34" rx="17" fill="#fff" stroke="#b9dbef"/>
  <circle cx="614" cy="171" r="7" fill="#0078d4"/>
  <text x="632" y="177" class="zone-label">AZURE</text>

  <!-- Desenvolvedor -->
  <g filter="url(#shadow)">
    <rect x="70" y="186" width="200" height="114" rx="18" fill="#fff" stroke="#d5e2eb"/>
  </g>
  <circle cx="114" cy="225" r="20" fill="#e7f4fc"/>
  <circle cx="114" cy="219" r="7" fill="#0078d4"/>
  <path d="M100 240c3-10 25-10 28 0" fill="#0078d4"/>
  <text x="145" y="224" class="node-title">Equipe</text>
  <text x="145" y="247" class="node-copy">Código e testes</text>
  <rect x="94" y="270" width="152" height="2" fill="#dce7ef"/>
  <text x="145" y="289" text-anchor="middle" class="micro">push para main</text>

  <!-- GitHub Actions -->
  <g filter="url(#shadow)">
    <rect x="330" y="186" width="202" height="114" rx="18" fill="#fff" stroke="#d5e2eb"/>
  </g>
  <rect x="356" y="211" width="38" height="38" rx="10" fill="#102238"/>
  <path d="M366 230h18M375 221v18" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="410" y="224" class="node-title">GitHub Actions</text>
  <text x="410" y="247" class="node-copy">Testa, cria e envia</text>
  <text x="431" y="281" text-anchor="middle" class="micro">OIDC + tag do commit</text>

  <!-- ACR -->
  <g filter="url(#shadow)">
    <rect x="646" y="206" width="270" height="116" rx="18" fill="#fff" stroke="#86c7ee"/>
  </g>
  <g transform="translate(674 233)">
    <rect width="44" height="44" rx="10" fill="#e5f3fc"/>
    <path d="M10 13h24v18H10zM16 8h12v5H16z" fill="none" stroke="#0078d4" stroke-width="2.5"/>
    <path d="M16 19h12M16 25h12" stroke="#0078d4" stroke-width="2"/>
  </g>
  <text x="736" y="245" class="node-title">Container Registry</text>
  <text x="736" y="269" class="node-copy">Imagem privada versionada</text>
  <rect x="736" y="285" width="147" height="23" rx="6" fill="#edf7fd"/>
  <text x="809" y="301" text-anchor="middle" class="micro">nuvemlab:&lt;sha&gt;</text>

  <!-- Usuário -->
  <g filter="url(#shadow)">
    <rect x="70" y="490" width="200" height="126" rx="18" fill="#fff" stroke="#d5e2eb"/>
  </g>
  <rect x="96" y="516" width="52" height="40" rx="5" fill="#e7f4fc" stroke="#0078d4" stroke-width="2"/>
  <rect x="105" y="524" width="34" height="21" rx="2" fill="#0078d4" opacity=".85"/>
  <path d="M88 564h68" stroke="#0078d4" stroke-width="3" stroke-linecap="round"/>
  <text x="169" y="531" class="node-title">Usuário</text>
  <text x="169" y="555" class="node-copy">Navegador</text>
  <text x="170" y="592" text-anchor="middle" class="micro">site + API REST</text>

  <!-- App Service -->
  <g filter="url(#shadow)">
    <rect x="646" y="382" width="554" height="270" rx="24" fill="#fff" stroke="#75bce8" stroke-width="2"/>
  </g>
  <rect x="646" y="382" width="554" height="68" rx="24" fill="url(#appFill)"/>
  <rect x="646" y="426" width="554" height="24" fill="url(#appFill)"/>
  <circle cx="680" cy="416" r="9" fill="#39d4d8"/>
  <text x="701" y="414" class="node-title white">Azure App Service</text>
  <text x="701" y="436" class="small white-soft">Plano Standard - HTTPS, slots e autoscale</text>
  <rect x="1048" y="402" width="126" height="30" rx="15" fill="#fff" opacity=".16"/>
  <text x="1111" y="422" text-anchor="middle" class="label white">PaaS</text>

  <rect x="680" y="478" width="486" height="132" rx="18" fill="#0c263a"/>
  <rect x="700" y="498" width="52" height="52" rx="12" fill="#143a54"/>
  <path d="M712 516h28v18h-28zM716 508h7v8h-7zM726 508h7v8h-7z" fill="none" stroke="#39d4d8" stroke-width="2.2"/>
  <text x="774" y="518" class="node-title white">Container Docker</text>
  <text x="774" y="543" class="small white-soft">FastAPI + Uvicorn - usuário não-root</text>
  <text x="774" y="570" class="micro white-soft">/  ·  /api/servicos  ·  /api/contato  ·  /health</text>
  <rect x="1026" y="516" width="110" height="42" rx="10" fill="#39d4d8"/>
  <text x="1081" y="535" text-anchor="middle" class="micro" font-weight="700">PORTA</text>
  <text x="1081" y="552" text-anchor="middle" class="label">8000</text>

  <!-- Volume -->
  <g filter="url(#shadow)">
    <rect x="1264" y="444" width="222" height="154" rx="20" fill="#fff" stroke="#86c7ee"/>
  </g>
  <ellipse cx="1311" cy="481" rx="24" ry="9" fill="#dff1fc" stroke="#0078d4" stroke-width="2"/>
  <path d="M1287 481v38c0 5 11 9 24 9s24-4 24-9v-38M1287 500c0 5 11 9 24 9s24-4 24-9" fill="none" stroke="#0078d4" stroke-width="2"/>
  <text x="1352" y="486" class="node-title">Volume</text>
  <text x="1352" y="510" class="node-copy">/home/data</text>
  <text x="1375" y="553" text-anchor="middle" class="small">SQLite demonstrativo</text>
  <text x="1375" y="575" text-anchor="middle" class="micro">1 instância</text>

  <!-- Monitor -->
  <g filter="url(#shadow)">
    <rect x="740" y="700" width="386" height="78" rx="18" fill="#fff" stroke="#b7d7e9"/>
  </g>
  <polyline points="770,744 792,724 812,741 837,712 864,736" fill="none" stroke="#0a7b57" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="890" y="731" class="node-title">Logs e métricas</text>
  <text x="890" y="754" class="node-copy">Saúde, CPU e escala horizontal</text>

  <!-- Linhas e rótulos -->
  <path d="M270 243H320" class="line"/>
  <rect x="279" y="216" width="32" height="20" rx="5" fill="#fff"/>
  <text x="295" y="230" text-anchor="middle" class="micro">Git</text>

  <path d="M532 243H634" class="line-blue"/>
  <rect x="555" y="216" width="56" height="20" rx="5" fill="#f7fbfe"/>
  <text x="583" y="230" text-anchor="middle" class="micro">push</text>

  <path d="M849 322C849 350 864 350 884 370" class="line-blue line-dashed"/>
  <rect x="858" y="332" width="74" height="22" rx="6" fill="#f3faff"/>
  <text x="895" y="347" text-anchor="middle" class="micro">pull</text>

  <path d="M270 553C396 553 488 530 632 530" class="line"/>
  <rect x="395" y="521" width="94" height="24" rx="6" fill="#f5fafc"/>
  <text x="442" y="538" text-anchor="middle" class="label">HTTPS 443</text>

  <path d="M1200 530H1252" class="line-blue"/>
  <rect x="1203" y="499" width="48" height="22" rx="6" fill="#f4fbff"/>
  <text x="1227" y="514" text-anchor="middle" class="micro">grava</text>

  <path d="M923 652V688" class="line line-dotted"/>

  <!-- Rodapé -->
  <rect x="70" y="838" width="1460" height="1" fill="#cddde8"/>
  <circle cx="83" cy="862" r="5" fill="#0078d4"/>
  <text x="99" y="867" class="small">Responsabilidade Azure: infraestrutura, plataforma, TLS e escala</text>
  <circle cx="624" cy="862" r="5" fill="#39d4d8"/>
  <text x="640" y="867" class="small">Responsabilidade da equipe: imagem, código, configurações, segredos e dados</text>
</svg>

