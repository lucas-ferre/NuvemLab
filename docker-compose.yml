services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: nuvemlab:local
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PORT: "8000"
      DATA_DIR: /home/data
    volumes:
      - contatos_data:/home/data
    networks:
      - nuvemlab_net
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  contatos_data:
    name: nuvemlab_contatos_data

networks:
  nuvemlab_net:
    name: nuvemlab_net
    driver: bridge

